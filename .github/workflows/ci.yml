name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:e2e       # renders real audio in headless Chromium and verifies it numerically
      - run: npm run test:e2e:ui    # builds the app and drives it with real clicks
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build
          path: dist
